<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Like Challenge</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" integrity="sha512-dPXYcDub/aeb08c63jRq/k6GaKccl256JQy/AnOq7CAnEZ9FzSL9wSbcZkMp4R26vBsMLFYH4kQ67/bbV8XaCQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 10px;
      text-align: center;
    }

    .top-donors {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .donor-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 14px;
    }

    .donor-card img {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      margin-bottom: 5px;
      object-fit: cover;
    }

    .like-bar-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .like-bar-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      height: 40px;
      border: 2px solid #fff;
      border-radius: 20px;
      overflow: hidden;
      background-color: #333;
      cursor: pointer;
    }

    .like-bar-fill {
      background: linear-gradient(to right, #f0c000, #fcd400);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .chest-img {
      width: 60px;
      height: 60px;
    }

    .likes-count {
      font-size: 28px;
      color: #fff;
      margin-bottom: 20px;
    }

    .popup {
      background-color: #fcd400;
      color: #111;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 12px;
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: none;
    }
  </style>
</head>
<body>

  <div class="popup" id="popupMessage">Treasure is available!</div>

  <div class="top-donors" id="topDonors"></div>
  <br><br><br><br><br><br>
  <div class="like-bar-wrapper" id="barWrapper">
    <div class="like-bar-container" id="likeBar">
      <div class="like-bar-fill" id="likeFill"></div>
    </div>
    <img src="/5bbc47db8353d-b4d03b6fa95d9fab240b315193f10790.png" alt="Treasure" class="chest-img" />
  </div>
  <br>
  <div class="likes-count">
    <span id="likesDisplay">0</span> / 5000 <i class="bi bi-heart-fill"></i>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const likeFill = document.getElementById('likeFill');
    const likesDisplay = document.getElementById('likesDisplay');
    const popup = document.getElementById('popupMessage');

    let totalLikes = 0;
    let likesSinceLastChest = 0;
    const maxLikes = 5000;
    let isChestAvailable = false;

    socket.on('likes', ({ likes }) => {
      const newLikes = likes - totalLikes;
      totalLikes = likes;

      if (!isChestAvailable) {
        likesSinceLastChest += Math.max(0, newLikes);
        updateBar();
      }
    });

    function updateBar() {
      const fillPercent = Math.min((likesSinceLastChest / maxLikes) * 100, 100);
      likeFill.style.width = `${fillPercent}%`;
      likesDisplay.textContent = likesSinceLastChest;

      if (fillPercent >= 100) {
        isChestAvailable = true;
        showPopup("Treasure is available!");
        setTimeout(() => {
          likesSinceLastChest = 0;
          likeFill.style.width = '0%';
          likesDisplay.textContent = '0';
          isChestAvailable = false;
        }, 5000);
      }
    }

    function showPopup(text) {
      popup.textContent = text;
      popup.style.display = 'block';
      setTimeout(() => popup.style.display = 'none', 3000);
    }

    socket.on('topDonors', (donors) => {
      const container = document.getElementById('topDonors');
      container.innerHTML = '';
      donors.slice(0, 3).forEach(donor => {
        const div = document.createElement('div');
        div.className = 'donor-card';
        div.innerHTML = `
          <img src="${donor.profile}" alt="${donor.name}">
          <div>${donor.name}</div>
          <div>Gifts: ${donor.count}</div>
        `;
        container.appendChild(div);
      });
    });

    document.getElementById('likeBar').addEventListener('click', () => {
      const el = document.documentElement;
      if (!document.fullscreenElement) {
        el.requestFullscreen().catch(err => console.error(err));
      } else {
        document.exitFullscreen();
      }
    });
  </script>
</body>
</html>
