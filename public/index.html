<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TTLG - Choose Your Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      margin-bottom: 40px;
      font-size: 28px;
    }

    .game-options {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 90%;
      max-width: 400px;
    }

    .game-btn {
      padding: 20px;
      font-size: 18px;
      background: #222;
      color: #fff;
      border: 2px solid #fff;
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.3s, transform 0.2s;
    }

    .game-btn:hover {
      background: #444;
      transform: scale(1.03);
    }

    @media (min-width: 600px) {
      .game-options {
        flex-direction: row;
      }
    }
  </style>
</head>
<body>
  <h1>Select a Game</h1>
  <div class="game-options">
    <a href="/game_1.html" class="game-btn">Red vs Blue</a>
    <a href="/game_2.html" class="game-btn">Like Challenge</a>
  </div>
</body>
</html>
