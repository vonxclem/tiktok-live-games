<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Live - Red vs Blue</title>
  <style>
    body {
      user-select: none;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 10px;
      text-align: center;
    }

    h1 {
      margin-bottom: 24px;
      font-size: 24px;
    }

    .score-icons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 80px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .score-box {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2em;
    }

    .score-box img {
      width: 50px;
      height: 50px;
    }

    .bar {
      display: flex;
      height: 180px;
      width: 100%;
      max-width: 600px;
      margin: 0 auto 30px;
      border: 2px solid #fff;
      border-radius: 10px;
      overflow: hidden;
    }

    .blue,
    .red {
      height: 100%;
      transition: width 0.3s ease;
    }

    .blue {
      background: linear-gradient(to right, #00f, #33f);
    }

    .red {
      background: linear-gradient(to left, #f00, #f55);
    }

    @media (max-width: 600px) {
      .score-box {
        flex-direction: column;
        gap: 5px;
      }

      .score-box img {
        width: 50px;
        height: 50px;
      }

      .bar {
        height: 180px;
      }
    }
  </style>
</head>
<body>
  <h1>
      <strong><span id="likesDisplay">0</span> / 10k &hearts;</strong>
      <br><span style="font-weight: light !important">Cadeaux aléatoires</span>
  </h1>

  <div class="score-icons">
    <div class="score-box">
      <img src="/blue.webp" alt="Flower" />
      <span id="blueScore">28</span>
    </div>
    <div class="score-box">
      <img src="/red.webp" alt="Heart Me" />
      <span id="redScore">31</span>
    </div>
  </div>

  <div class="bar">
    <div id="blue" class="blue" style="width:50%"></div>
    <div id="red" class="red" style="width:50%"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    socket.on('update', ({ blue, red }) => {
      const total = blue + red || 1;
      const bluePercent = (blue / total) * 100;

      document.getElementById('blue').style.width = `${bluePercent}%`;
      document.getElementById('red').style.width = `${100 - bluePercent}%`;
      document.getElementById('blueScore').textContent = blue;
      document.getElementById('redScore').textContent = red;
    });

    socket.on('likes', ({ likes }) => {
      document.getElementById('likesDisplay').textContent = `${likes}`;
    });

    document.querySelector('h1').addEventListener('click', () => {
      const el = document.documentElement;
      if (!document.fullscreenElement) {
        el.requestFullscreen().catch((err) => {
          alert(`Error: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    });
  </script>
</body>
</html>
