<!DOCTYPE html>
<html>
<head>
  <title>Red vs Blue</title>
  <style>
    body { background: #111; color: #fff; text-align: center; font-family: sans-serif; }
    .bar { display: flex; height: 200px; margin: 50px auto; width: 80%; border: 2px solid #fff; }
    .blue, .red { height: 100%; transition: width 0.3s; }
    .blue { background-color: blue; }
    .red { background-color: red; }
  </style>
</head>
<body>
  <h1>Live Battle</h1>
  <div class="bar">
    <div id="blue" class="blue" style="width:50%"></div>
    <div id="red" class="red" style="width:50%"></div>
  </div>
  <p id="score">Blue : 0 | Red : 0</p>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    socket.on('update', ({ blue, red }) => {
      const total = blue + red;
      const bp = (blue / total) * 100;
      document.getElementById('blue').style.width = bp + '%';
      document.getElementById('red').style.width = (100 - bp) + '%';
      document.getElementById('score').textContent = `Blue : ${blue} | Red : ${red}`;
    });
  </script>
</body>
</html>
